name: publish-ruleset

on:
  push:
    branches: [main]
    paths: ["rules/**", "schema/**", "tools/**", "mirrors/**"]
  schedule:
    - cron: "17 2 * * *" # 每日兜底重建（节假日日历会随时间推进）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验规则
        run: python3 tools/validate.py

      - name: 构建 dist
        id: build
        run: |
          python3 tools/build.py
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dist 无变化，跳过发布"
          fi

      - name: 提交 dist 变更
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: 重新生成 dist [skip ci]"
          git push

      - name: 打 tag 并发 Release
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['version'])")
          git tag "ruleset-$V"
          git push origin "ruleset-$V"
          gh release create "ruleset-$V" dist/ruleset.json dist/manifest.json mirrors/mirrors.json \
            --title "ruleset $V" --notes "由 CI 自动发布（tag 引用可被 jsDelivr 永久缓存）"

      # npm / npmmirror 通道按 2026-10-19 决策不采用（理由见 mirrors/mirrors.json 的 npmmirror 条目），故无 npm 发布步骤。
